services:

  backend:
    build:
      context: ./backend
    container_name: whatsapp-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: whatsapp-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped